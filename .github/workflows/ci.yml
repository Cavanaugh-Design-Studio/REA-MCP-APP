name: REA MCP App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Build owned Windows component
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Prepare compiler on the disposable build runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-mingw-w64-x86-64
      - run: npm run build:windows-native
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-controls
          path: native/windows/build/
          if-no-files-found: error

  checks:
    name: Build and test (${{ matrix.os }})
    needs: native-windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      REA_TEST_BROWSER: ${{ matrix.os == 'windows-latest' && 'C:/Program Files/Google/Chrome/Application/chrome.exe' || '/usr/bin/google-chrome' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-controls
          path: native/windows/build/
      - run: npm run typecheck
      - run: npm run build
      - name: Require an installed browser for real capture coverage
        run: node -e "if (!require('node:fs').existsSync(process.env.REA_TEST_BROWSER)) throw new Error('CI browser is unavailable; capture acceptance must not silently skip')"
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
