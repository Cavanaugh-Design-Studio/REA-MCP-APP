<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Annotation feature fixture</title>
    <style>
      body {
        margin: 0;
        background: #111827;
        color: #e5eaf5;
        font: 16px system-ui;
      }
      main {
        max-width: 1050px;
        margin: 30px auto;
        padding: 24px;
      }
      .eyebrow {
        color: #93b9ff;
      }
      h1 {
        font-size: 30px;
      }
      section {
        padding: 20px;
        background: #1d273b;
        border: 1px solid #36425b;
        border-radius: 14px;
        margin: 16px 0;
      }
      label {
        display: inline-flex;
        flex-direction: column;
        margin: 8px;
        gap: 6px;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        background: #111c30;
        color: #ecf2ff;
        border: 1px solid #526384;
        border-radius: 7px;
        padding: 9px;
      }
      input {
        width: 120px;
      }
      button {
        cursor: pointer;
        margin: 5px;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #9d9aff;
      }
      button.primary {
        background: #3359ae;
      }
      #paper {
        position: relative;
        background: #f4f1e9;
        color: #222;
        width: 320px;
        height: 240px;
        margin: 20px;
        overflow: hidden;
      }
      .annotation {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #845ce6;
        transform: translate(-7px, -7px);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #a9c9ff;
      }
      textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 100px;
      }
      [role="status"] {
        color: #eec77d;
      }
      @media (max-width: 650px) {
        main {
          margin: 0;
          padding: 12px;
        }
        #paper {
          margin: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Source-owned browser demonstrator</span>
      <h1>Document annotation lab</h1>
      <p>
        Place a note in display coordinates, then retain its document
        coordinates through transforms and save.
      </p>
      <section>
        <label
          >Zoom<input
            id="zoom"
            aria-label="Zoom"
            type="number"
            value="1"
            step="0.25" /></label
        ><button id="apply-zoom">Apply zoom</button
        ><button id="rotate">Rotate clockwise</button
        ><label
          >Display X<input
            id="x"
            aria-label="Display X"
            type="number"
            value="80" /></label
        ><label
          >Display Y<input
            id="y"
            aria-label="Display Y"
            type="number"
            value="60" /></label
        ><button class="primary" id="place">Place annotation</button
        ><button id="move">Move annotation</button
        ><button id="undo">Undo</button><button id="redo">Redo</button>
        <div id="paper" aria-label="Document canvas">
          <div id="markers"></div>
        </div>
        <pre id="semantic" aria-label="Semantic document state"></pre>
        <p id="status" role="status">Ready</p>
      </section>
      <section>
        <button id="save">Save document</button
        ><button id="close">Close document</button
        ><button id="reopen">Reopen document</button
        ><button id="cancel-save">Cancel save</button
        ><label for="import">Document JSON</label
        ><textarea
          id="import"
          aria-label="Document JSON"
          spellcheck="false"
        ></textarea
        ><button id="import-document">Import document</button>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
